name: ViSoBERT supervised CPU training

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/train-visobert-cpu.yml
      - absa_solution/launch_visobert_training.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: absa-visobert-cpu
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      HF_HOME: /tmp/absa-hf-cache
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'absa_solution/requirements*.txt'
      - name: Install CPU-only dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r absa_solution/requirements_visobert.txt
      - name: Check syntax and run one real training batch
        working-directory: absa_solution
        run: |
          python -m py_compile phobert_absa.py finetune_cpu_cached.py export_phobert_adapter.py
          python phobert_absa.py smoke --model-name uitnlp/visobert --revision 196a62afad9cbe4f52a54aabad828b13f0eec59a --fast-tokenizer --no-segmentation --data-dir .. --unfreeze-layers 12 --cpu-threads 2 --max-length 160 --stride 32
      - name: Fine-tune all 12 encoder layers; select using tuning only
        working-directory: absa_solution
        run: |
          python -u phobert_absa.py train --model-name uitnlp/visobert --revision 196a62afad9cbe4f52a54aabad828b13f0eec59a --fast-tokenizer --no-segmentation --data-dir .. --out-dir full_visobert_results --unfreeze-layers 12 --epochs 8 --patience 2 --batch-size 8 --accumulation 2 --cpu-threads 4 --lr 0.00002 --max-length 160 --stride 32 --no-refit
      - name: Export exact compact model without frozen embedding weights
        working-directory: absa_solution
        run: |
          python export_phobert_adapter.py export --model-dir full_visobert_results --adapter-dir visobert_adapter
      - name: Publish aggregate result in the run summary
        if: always()
        working-directory: absa_solution
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('full_visobert_results/metrics.json')
          text='# ViSoBERT CPU training\n\n'
          if p.exists():
              r=json.loads(p.read_text())
              text+=f"Validation ABSA-F1: **{r['ABSA_F1']:.4f}**\n\n"
              text+=f"Bootstrap CI95%: {r['ABSA_F1_CI95']}\n\n"
              text+=f"Target 0.90 reached on this validation: {r['ABSA_F1'] >= .90}\n\n"
              text+='This is validation, not public/private test performance.\n'
          else:
              text+='Training has not produced a complete validation report. No F1 claim.\n'
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(text)
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: visobert-cpu-model-and-submission
          path: absa_solution/visobert_adapter/
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visobert-aggregate-progress
          path: |
            absa_solution/full_visobert_results/history.csv
            absa_solution/full_visobert_results/metrics.json
            absa_solution/full_visobert_results/run_info.json
            absa_solution/full_visobert_results/config.json
            absa_solution/full_visobert_results/tune_scores.npz
            absa_solution/full_visobert_results/validation_scores.npz
          if-no-files-found: ignore
          retention-days: 3
