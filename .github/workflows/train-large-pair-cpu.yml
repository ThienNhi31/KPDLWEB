name: PhoBERT large aspect-conditioned CPU training
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/train-large-pair-cpu.yml
      - absa_solution/launch_large_pair.txt
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: absa-large-pair-cpu
  cancel-in-progress: true
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      HF_HOME: /tmp/absa-hf-cache
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '4'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'absa_solution/requirements*.txt'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r absa_solution/requirements_phobert.txt
      - name: Check large model architecture and real paired backward
        working-directory: absa_solution
        run: |
          python -m py_compile aspect_pair_absa.py export_phobert_adapter.py
          python - <<'PY'
          import torch,pandas as pd,numpy as np
          from aspect_pair_absa import *
          torch.set_num_threads(2)
          name='vinai/phobert-large'
          rev='70e2cfcd3cce29c970aee4954ea34a32bb30afdc'
          data=pd.read_csv('../train.csv').iloc[:2]
          y=data[scorer.COLS].to_numpy(int)
          tok=AutoTokenizer.from_pretrained(name,revision=rev,use_fast=False)
          ds=PairReviews(data.text,tok,y)
          assert np.array_equal(ds.labels.numpy().reshape(2,21),y)
          m=PairModel(name,rev,4)
          assert len(m.encoder.encoder.layer)==24 and m.encoder.config.hidden_size==1024
          inputs,counts,labels=next(iter(loader(ds,tok,2)))
          logits=m(inputs,counts)
          loss=nn.BCEWithLogitsLoss()(logits,labels)
          loss.backward()
          assert torch.isfinite(loss)
          print('Large-model shared head backward and 21-label regrouping passed.')
          PY
      - name: Train last four of 24 layers on train only
        working-directory: absa_solution
        run: |
          python -u aspect_pair_absa.py --data-dir .. --out-dir large_pair_results --cache private_cache/large_pair.pt --model-name vinai/phobert-large --revision 70e2cfcd3cce29c970aee4954ea34a32bb30afdc --epochs 8 --patience 2 --layers 4 --threads 4 --batch-size 8 --accumulation 2 --lr 0.00002 --max-length 160 --stride 32 --negatives 2
      - name: Export model only
        working-directory: absa_solution
        run: |
          python export_phobert_adapter.py export --model-dir large_pair_results --adapter-dir large_pair_adapter
      - name: Add validation summary
        if: always()
        working-directory: absa_solution
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          p=Path('large_pair_results/metrics.json')
          text='# PhoBERT-large paired ABSA on CPU\n\n'
          if p.exists():
              r=json.loads(p.read_text())
              text+=f"Validation ABSA-F1: **{r['ABSA_F1']:.4f}**\n\nCI95%: {r['ABSA_F1_CI95']}\n\nTarget 0.96 reached: {r['ABSA_F1'] >= .96}\n"
          else:text+='No completed validation report yet.\n'
          text+='\nNo blind test text or predictions are read/exported.\n'
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(text)
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: large-pair-cpu-model-only
          path: absa_solution/large_pair_adapter/
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: large-pair-aggregate-progress
          path: |
            absa_solution/large_pair_results/history.csv
            absa_solution/large_pair_results/metrics.json
            absa_solution/large_pair_results/run_info.json
            absa_solution/large_pair_results/config.json
            absa_solution/large_pair_results/tune_scores.npz
            absa_solution/large_pair_results/validation_scores.npz
          if-no-files-found: ignore
          retention-days: 7
